services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-toko
    hostname: rabbitmq-toko        # hostname tetap agar data pada volume tetap terbaca
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # penyimpanan data persisten

volumes:
  rabbitmq_data: